<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB-IoT 信号测试</title>
<style>
  :root {
    color-scheme: light dark;
    --green: #1e8e3e; --amber: #e8a33d; --red: #d93025;
    --bg-soft: rgba(127,127,127,.09); --line: rgba(127,127,127,.28);
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 14px 14px 40px; max-width: 760px; margin-inline: auto; line-height: 1.5; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  h2 { font-size: .95rem; margin: 0 0 8px; opacity: .85; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  button { font: inherit; font-size: .92rem; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: #2f6fdb; color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: inherit; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { opacity: .7; font-size: .85rem; }
  nav { display: flex; gap: 6px; margin-bottom: 12px; }
  nav button { flex: 1; background: transparent; color: inherit; border: 1px solid var(--line); }
  nav button.active { background: #2f6fdb; color: #fff; border-color: #2f6fdb; }
  .signal { text-align: center; padding: 18px 12px; border-radius: 14px; border: 2px solid var(--line); transition: border-color .3s, background .3s; }
  .signal.g1, .signal.g2 { border-color: var(--green); background: rgba(30,142,62,.08); }
  .signal.g3, .signal.g4 { border-color: var(--amber); background: rgba(232,163,61,.10); }
  .signal.g5, .signal.g6 { border-color: var(--red); background: rgba(217,48,37,.09); }
  .signal .num { font-size: 3.4rem; font-weight: 800; line-height: 1; }
  .signal.g1 .num, .signal.g2 .num { color: var(--green); }
  .signal.g3 .num, .signal.g4 .num { color: var(--amber); }
  .signal.g5 .num, .signal.g6 .num { color: var(--red); }
  .signal .lvl { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
  .signal .big { font-size: 2rem; font-weight: 700; margin-top: 10px; }
  .signal .unit { font-size: .9rem; opacity: .7; }
  .advice { margin-top: 10px; font-size: .95rem; }
  .meta { margin-top: 8px; font-size: .85rem; opacity: .8; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  th { font-weight: 600; opacity: .8; }
  td.v { font-family: ui-monospace, Consolas, monospace; }
  input[type=text], select { font: inherit; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
  input[type=text] { flex: 1; min-width: 120px; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; white-space: pre-wrap; word-break: break-all; background: #000; color: #0f0; padding: 10px; border-radius: 8px; max-height: 240px; overflow: auto; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: .78rem; }
  .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">NB-IoT 信号测试</h1>
  <button class="ghost" id="langBtn" title="Language">EN</button>
</header>

<section class="card">
  <div class="row">
    <button id="btnConnect" data-i18n="connect">连接设备</button>
    <button id="btnDisconnect" class="ghost" disabled data-i18n="disconnect">断开</button>
    <span id="connStatus" class="muted" data-i18n="notConnected">未连接</span>
  </div>
  <div class="muted" style="margin-top:6px" data-i18n="connectHint">需要 HTTPS 页面、测试棒已插好、厚德 App 已完全关闭。</div>
</section>

<nav>
  <button id="tabSimple" class="active" data-i18n="tabSimple">客户视图</button>
  <button id="tabAdvanced" data-i18n="tabAdvanced">高级数据</button>
</nav>

<section id="viewSimple">
  <div class="card signal" id="signalCard">
    <div class="num" id="gradeNum">–</div>
    <div class="lvl" id="gradeLvl" data-i18n="noData">等待连接</div>
    <div class="big"><span id="rsrpVal">--</span> <span class="unit">dBm</span></div>
    <div class="advice" id="advice"></div>
    <div class="meta" id="simpleMeta"></div>
  </div>
</section>

<section id="viewAdvanced" hidden>
  <div class="card">
    <h2 data-i18n="metrics">当前读数</h2>
    <table>
      <tr><td>RSRP</td><td class="v" id="mRsrp">--</td></tr>
      <tr><td>RSRQ</td><td class="v" id="mRsrq">--</td></tr>
      <tr><td>RSSI</td><td class="v" id="mRssi">--</td></tr>
      <tr><td>SNR</td><td class="v" id="mSnr">--</td></tr>
      <tr><td>CSQ</td><td class="v" id="mCsq">--</td></tr>
      <tr><td>ECL</td><td class="v" id="mEcl">--</td></tr>
      <tr><td>EARFCN</td><td class="v" id="mEarfcn">--</td></tr>
      <tr><td>PCI</td><td class="v" id="mPci">--</td></tr>
      <tr><td>Band</td><td class="v" id="mBand">--</td></tr>
      <tr><td>Cell ID</td><td class="v" id="mCell">--</td></tr>
    </table>
    <div class="row" style="margin-top:10px">
      <button id="btnRefresh" data-i18n="refresh">刷新一次</button>
      <label class="muted"><input type="checkbox" id="autoPoll" checked> <span data-i18n="autoPoll">自动刷新（5 秒）</span></label>
    </div>
  </div>
</section>

<section class="card">
  <h2 data-i18n="records">点位记录</h2>
  <div class="row" style="margin-bottom:8px">
    <input type="text" id="pointLabel" list="pointList" placeholder="点位标签，如 A1 原位" data-i18n-placeholder="pointPlaceholder">
    <datalist id="pointList">
      <option value="A1 原位"></option>
      <option value="A2 换朝向"></option>
      <option value="A3 抬高1m"></option>
      <option value="B1 邻树"></option>
      <option value="OPEN 开阔参照"></option>
    </datalist>
    <button id="btnSave" data-i18n="save">保存当前读数</button>
  </div>
  <div id="recordsWrap"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnExport" class="ghost" data-i18n="exportCsv">导出 CSV</button>
    <button id="btnClear" class="ghost" data-i18n="clear">清空</button>
  </div>
  <div id="compareWrap" style="margin-top:12px"></div>
</section>

<details class="card">
  <summary class="muted" data-i18n="logTitle">AT 日志</summary>
  <div id="log" style="margin-top:8px"></div>
</details>

    const cls = (ok) => ok ? "ok" : "bad";
    $("cmpOut").innerHTML =
      `<div>${t("rsrpDiff")}: <b>${dRsrp.toFixed(1)} dB</b></div>` +
      `<div>${t("csqGain")}: <b>${dCsq}</b></div>` +
      `<div>${samePci ? t("pciSame") : t("pciDiff")}</div>` +
      `<div style="margin-top:6px">${t("judgeRsrp")}: <span class="${cls(j1)}">${j1 ? t("pass") : t("fail")}</span></div>` +
      `<div>${t("judgeCsq")}: <span class="${cls(j2)}">${j2 ? t("pass") : t("fail")}</span></div>`;
  };
  $("cmpA").addEventListener("change", run);
  $("cmpB").addEventListener("change", run);
  run();
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ================= 记录 ================= */
function persistRecords() {
  localStorage.setItem("nbtest.records", JSON.stringify(state.records));
}

function saveRecord() {
  const label = $("pointLabel").value.trim();
  if (!label) { alert(t("needLabel")); return; }
  if (!state.reading) { alert(t("noReading")); return; }
  const r = state.reading;
  state.records.push({
    id: Date.now(), at: r.at, label,
    rsrp: r.rsrp, grade: r.grade, csq: r.csq, rsrq: r.rsrq, rssi: r.rssi,
    snr: r.snr, ecl: r.ecl, earfcn: r.earfcn, pci: r.pci, band: r.band, cellId: r.cellId
  });
  persistRecords();
  renderRecords();
  log(`${t("saved")}: ${label}`, "sys");
}

function exportCsv() {
  const head = [t("colTime"), t("colPoint"), "RSRP(dBm)", t("colGrade"), "CSQ", "RSRQ(dB)", "RSSI(dBm)", "SNR(dB)", "ECL", "EARFCN", "PCI", "Band", "CellID"];
  const rows = state.records.map((x) => [new Date(x.at).toLocaleString(), x.label, fmt(x.rsrp, 1), x.grade, fmt(x.csq), fmt(x.rsrq, 1), fmt(x.rssi, 1), fmt(x.snr, 1), fmt(x.ecl), fmt(x.earfcn), fmt(x.pci), x.band ? "B" + x.band : "", fmt(x.cellId)]);
  const csv = [head, ...rows].map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  a.href = URL.createObjectURL(blob);
  a.download = `nb-signal-${stamp}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ================= 事件 ================= */
$("btnConnect").addEventListener("click", connect);
$("btnDisconnect").addEventListener("click", disconnect);
$("btnRefresh").addEventListener("click", refresh);
$("btnSave").addEventListener("click", saveRecord);
$("btnExport").addEventListener("click", exportCsv);
$("btnClear").addEventListener("click", () => {
  if (!state.records.length) return;
  if (confirm(t("confirmClear"))) { state.records = []; persistRecords(); renderRecords(); }
});
$("tabSimple").addEventListener("click", () => switchView("simple"));
$("tabAdvanced").addEventListener("click", () => switchView("advanced"));
$("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("nbtest.lang", lang);
  applyI18n();
});
function switchView(v) {
  state.view = v;
  $("viewSimple").hidden = v !== "simple";
  $("viewAdvanced").hidden = v !== "advanced";
  $("tabSimple").classList.toggle("active", v === "simple");
  $("tabAdvanced").classList.toggle("active", v === "advanced");
}

applyI18n();
log("ready", "sys");
</script>
</body>
</html>

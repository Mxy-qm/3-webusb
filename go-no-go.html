<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NB-IoT WebUSB diagnostics</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; max-width: 720px; margin-inline: auto; line-height: 1.5; }
  header { display: flex; align-items: center; gap: 10px; margin: .2em 0 .6em; }
  h1 { font-size: 1.2rem; margin: 0; flex: 1; min-width: 0; }
  select { font: inherit; font-size: .95rem; padding: 5px 5px; border-radius: 8px; border: 1px solid #888; }
  .card { border: 1px solid #8884; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .note { font-size: .85rem; opacity: .8; }
  button { font-size: 1rem; padding: 8px 14px; border-radius: 8px; border: 1px solid #888; background: #2f6fdb; color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: inherit; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button + button { margin-left: 6px; }
  .quick { margin: 6px 4px 0 0; padding: 4px 10px; font-size: .9rem; }
  #envcheck div { margin: 2px 0; }
  .ok::before { content: "✅ "; }
  .bad::before { content: "❌ "; }
  #status { font-weight: 600; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; white-space: pre-wrap; word-break: break-all; background: #000; color: #0f0; padding: 10px; border-radius: 8px; height: 320px; overflow-y: auto; }
  #log .tx { color: #ffd54f; }
  #log .rx { color: #69f0ae; }
  #log .sys { color: #90a4ae; }
  #log .hl  { color: #ff8a80; font-weight: 700; }
  #verdict { font-size: 1.3rem; font-weight: 700; text-align: center; padding: 10px; border-radius: 10px; margin-top: 8px; }
  #verdict.go { background: #1b5e20; color: #fff; }
  #verdict.nogo { background: #b71c1c; color: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  td, th { border: 1px solid #8886; padding: 4px 8px; text-align: left; }
  input[type=text] { font-size: 1rem; padding: 8px; border-radius: 8px; border: 1px solid #888; width: calc(100% - 90px); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .btnset button { margin: 4px 4px 0 0; font-size: .9rem; padding: 6px 12px; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="h1">NB-IoT dongle · direct browser test</h1>
  <select id="langSel" aria-label="Language" title="Language / 语言 / 語言">
    <option value="en">EN</option>
    <option value="zh">简</option>
    <option value="zhHant">繁</option>
  </select>
</header>

<div class="card" id="envcheck">
  <b data-i18n="envTitle">Environment check</b>
  <div id="envsecure"></div>
  <div id="envusb"></div>
  <div id="envserial"></div>
</div>

<div class="card">
  <b data-i18n="connTitle">Connect (try each channel)</b>
  <div class="btnset">
    <button id="btnNative" hidden data-i18n="btnNative">① Native Web Serial</button>
    <button id="btnCh340" data-i18n="btnCh340">② WebUSB · CH340</button>
    <button id="btnCdc" data-i18n="btnCdc">③ WebUSB · CDC-ACM</button>
    <button id="btnDiag" class="ghost" data-i18n="btnDiag">④ Diagnose: list every USB device</button>
  </div>
  <div class="row">
    <button id="btnDisconnect" class="ghost" disabled data-i18n="btnDisconnect">Disconnect</button>
  </div>
  <div id="status" data-i18n="statusIdle">Not connected</div>
  <div class="note" style="margin-top:6px" data-i18n="connHint"></div>
</div>

<div class="card" id="autoCard" hidden>
  <button id="btnAuto" data-i18n="btnAuto">⑤ Auto test: AT ×10</button>
  <div id="verdict" hidden></div>
  <div id="resultTable"></div>
</div>

<div class="card">
  <b data-i18n="manualTitle">Manual AT</b>
  <div class="row">
    <input type="text" id="cmdInput" data-i18n-placeholder="cmdPlaceholder" autocomplete="off">
    <button id="btnSend" data-i18n="btnSend">Send</button>
  </div>
  <div>
    <button class="quick" data-cmd="AT">AT</button>
    <button class="quick" data-cmd="ATI">ATI</button>
    <button class="quick" data-cmd="AT+CSQ">AT+CSQ</button>
    <button class="quick" data-cmd="AT+NUESTATS">AT+NUESTATS</button>
    <button class="quick" data-cmd="AT+NUESTATS=CELL">NUESTATS=CELL</button>
    <button class="quick" data-cmd="AT+NBAND?">AT+NBAND?</button>
    <button class="quick" data-cmd="AT+CGMM">AT+CGMM</button>
  </div>
  <div class="note" style="margin-top:6px" data-i18n="cmdHint"></div>
</div>

<div class="card">
  <div class="row">
    <b style="flex:1" data-i18n="logTitle">Log</b>
    <button id="btnCopy" class="ghost" style="font-size:.85rem;padding:4px 10px" data-i18n="btnCopy">Copy all</button>
    <button id="btnClear" class="ghost" style="font-size:.85rem;padding:4px 10px" data-i18n="btnClear">Clear</button>
  </div>
  <div id="log"></div>
</div>

        kind = hasCdc ? "cdc" : "ch340";
    }
    log(T("logChip", { chip, drv: kind === "cdc" ? "CDC-ACM" : "CH340" }), "sys");
    if (kind === "ch340") {
        const p = new WebUSBSerialPort(device);
        await p.open({ baudRate: 9600 });
        port = p;
        bindStreams(p, "WebUSB · CH340");
    } else {
        const p = new CdcPolyfill.SerialPort(device, {
            protocol: CdcPolyfill.SerialPolyfillProtocol.UsbCdcAcm,
            usbControlInterfaceClass: 2,
            usbTransferInterfaceClass: 10,
        });
        await p.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: "none" });
        port = p;
        bindStreams(p, "WebUSB · CDC-ACM");
    }
    log(t("logConnected"), "sys");
}

async function diagnose() {
    try {
        if (!navigator.usb) throw new Error(t("noWebusb"));
        setStatus("stListing");
        const device = await navigator.usb.requestDevice({ filters: [{}] });
        log(t("diagTag") + describeDevice(device), "sys");
        log(T("diagChip", { chip: guessChip(device) }), "sys");
        setStatus("stDiagSelected");
        const go = confirm(t("confirmConnect"));
        if (go) await openDevice(device);
    } catch (e) {
        const msg = explainError(e);
        setStatus("stDiagFail", { msg });
        log(T("diagFail", { msg }), "sys");
        log(t("diagHintEmpty"), "sys");
    }
}

async function disconnect() {
    try { if (reader) await reader.cancel(); } catch (e) {}
    try { if (writer) writer.releaseLock(); } catch (e) {}
    try { if (port) await port.close(); } catch (e) {}
    port = writer = reader = null;
    lineBuf = "";
    setStatus("stDisconnected");
    $("btnDisconnect").disabled = true;
    log(t("logDisconnected"), "sys");
}

async function sendCmd(cmd, timeoutMs = 3000) {
    if (!port || !writer) { log(t("logNotConnected"), "sys"); return null; }
    log("→ " + cmd, "tx");
    await writer.write(new TextEncoder().encode(cmd + "\r\n"));
    const lines = [];
    const deadline = Date.now() + timeoutMs;
    for (;;) {
        const left = deadline - Date.now();
        if (left <= 0) break;
        const line = await new Promise((res) => { lineWaiter = res; setTimeout(() => { if (lineWaiter === res) { lineWaiter = null; res(null); } }, left); });
        if (line === null) break;
        lines.push(line);
        if (/^(OK|ERROR|\+CME ERROR)/i.test(line)) break;
    }
    return lines;
}

let lastAutoRows = null;
function renderVerdict() {
    if (!lastAutoRows) return;
    const pass = lastAutoRows.filter((r) => r[2]).length;
    const v = $("verdict");
    v.hidden = false;
    v.className = pass === 10 ? "go" : "nogo";
    v.textContent = pass === 10 ? t("verdictGo") : T("verdictNogo", { pass, fail: 10 - pass });
    let html = `<table><tr><th>${t("colNo")}</th><th>${t("colResp")}</th><th>${t("colVerdict")}</th></tr>`;
    for (const [i, resp, ok] of lastAutoRows) html += `<tr><td>${i}</td><td>${escapeHtml(resp)}</td><td>${ok ? "✅" : "❌"}</td></tr>`;
    html += `</table>`;
    $("resultTable").innerHTML = html;
}

$("btnAuto").addEventListener("click", async () => {
    const btn = $("btnAuto");
    btn.disabled = true;
    const rows = [];
    for (let i = 1; i <= 10; i++) {
        const lines = await sendCmd("AT");
        const ok = lines && lines.some((l) => /^OK/i.test(l));
        rows.push([i, lines && lines.length ? lines.join(" / ") : t("noResponse"), ok]);
        if (i < 10) await sleep(700);
    }
    lastAutoRows = rows;
    const pass = rows.filter((r) => r[2]).length;
    renderVerdict();
    log(T("logAutoDone", { pass, verdict: pass === 10 ? "GO" : "NO-GO" }), "sys");
    btn.disabled = false;
    btn.textContent = t("btnAutoAgain");
});

function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

async function sendManual(cmd) {
    cmd = (cmd || "").trim();
    if (!cmd) return;
    if (port && writer) await sendCmd(cmd, cmd.toUpperCase() === "AT+NUESTATS" ? 5000 : 3000);
    else log(t("logNotConnectedTap"), "sys");
}
$("btnSend").addEventListener("click", () => { sendManual($("cmdInput").value); $("cmdInput").value = ""; });
$("cmdInput").addEventListener("keydown", (e) => { if (e.key === "Enter") { sendManual($("cmdInput").value); $("cmdInput").value = ""; } });
document.querySelectorAll(".quick").forEach((b) => b.addEventListener("click", () => sendManual(b.dataset.cmd)));

$("btnNative").addEventListener("click", connectNative);
$("btnCh340").addEventListener("click", () => connectWebUsb("ch340"));
$("btnCdc").addEventListener("click", () => connectWebUsb("cdc"));
$("btnDiag").addEventListener("click", diagnose);
$("btnDisconnect").addEventListener("click", disconnect);
$("btnClear").addEventListener("click", () => { logEl.textContent = ""; });
$("btnCopy").addEventListener("click", async () => {
    try {
        await navigator.clipboard.writeText(logEl.textContent);
        $("btnCopy").textContent = t("copied");
        setTimeout(() => { $("btnCopy").textContent = t("btnCopy"); }, 1200);
    } catch (e) { log(T("copyFail", { msg: e.message }), "sys"); }
});

$("langSel").addEventListener("change", (e) => {
    lang = e.target.value;
    localStorage.setItem("nbtest.lang", lang);   // 与产品页共用，切完产品页也跟着走
    applyI18n();
});

applyI18n();
log(t("logReady"), "sys");
</script>
